[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclassicalarchives"
dynamic = ["version"]
description = "Typed Python client for Classical Archives (classicalarchives.com)"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
stealth = ["curl-cffi"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyclassicalarchives*"]

[tool.setuptools.dynamic]
version = {attr = "pyclassicalarchives.version.__version__"}
